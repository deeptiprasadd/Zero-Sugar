<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ T.title }}{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --bg:#f5f4f0; --panel:#ffffff; --ink:#1b1b19; --ink2:#5d5a53; --ink3:#8a867d; --line:#e4e1d9; --soft:#f0eee8;
          --accent:#d0101d; --accent-ink:#ffffff; --accent-soft:#fde8e9; --head:#141413;
          --warn:#fff6dc; --warnline:#e9cd78; --warnink:#5c4708; --ok:#e6f2ea; --okink:#1f5a35;
          --bar:#e7e4dc; --mark:#141413; --shadow:0 1px 2px rgba(20,20,19,.06), 0 4px 14px rgba(20,20,19,.05); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121211; --panel:#1c1c1a; --ink:#ecebe6; --ink2:#aaa69d; --ink3:#7d7a72; --line:#33322d; --soft:#252522;
            --accent:#ff4d57; --accent-ink:#1a0003; --accent-soft:#3a1517; --head:#0b0b0a;
            --warn:#2b2414; --warnline:#6e5a22; --warnink:#f0d993; --ok:#17291e; --okink:#9ed3ae;
            --bar:#34332e; --mark:#f4f3ee; --shadow:none; } }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--accent); } a:hover { text-decoration-thickness:2px; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px; }
  header.top { background:var(--head); color:#f4f3ee; border-bottom:3px solid var(--accent); }
  header.top .wrap { display:flex; align-items:center; gap:14px; min-height:60px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; color:#f4f3ee; text-decoration:none; font-weight:700; letter-spacing:.01em; }
  .brand .dot { width:26px; height:26px; border-radius:50%; background:var(--accent); display:grid; place-items:center;
                color:#fff; font-size:.8rem; font-weight:800; flex:none; }
  header.top nav { margin-left:auto; display:flex; gap:4px; }
  header.top nav a { color:#d9d7d0; text-decoration:none; padding:6px 10px; border-radius:7px; font-size:.95rem; }
  header.top nav a:hover, header.top nav a.on { background:#2a2a27; color:#fff; }
  main { padding:22px 0 40px; }
  h1 { font-size:1.75rem; line-height:1.2; margin:.1em 0 .25em; letter-spacing:-.01em; }
  h2 { font-size:1.1rem; margin:0 0 .5em; } h3 { font-size:1rem; margin:0 0 .35em; }
  p { margin:.45em 0; } .lead { color:var(--ink2); font-size:1.03rem; max-width:62ch; }
  .muted { color:var(--ink2); } .small { font-size:.88rem; } .tiny { font-size:.8rem; color:var(--ink3); }
  main, p, td, li { overflow-wrap:anywhere; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:0 0 16px;
          box-shadow:var(--shadow); min-width:0; }
  .card > :last-child { margin-bottom:0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-bottom:16px; }
  .grid2 > .card { margin:0; }
  .callout { background:var(--warn); border:1px solid var(--warnline); color:var(--warnink); border-radius:12px;
             padding:14px 18px; margin:0 0 16px; }
  .callout h2 { color:inherit; } .callout ul { margin:.3em 0 0; padding-left:1.2em; } .callout li { margin:.25em 0; }
  .badge { display:inline-block; font-size:.74rem; font-weight:650; letter-spacing:.02em; padding:2px 9px; border-radius:999px;
           background:var(--soft); border:1px solid var(--line); color:var(--ink2); vertical-align:middle; white-space:nowrap; }
  .badge.red { background:var(--accent-soft); border-color:transparent; color:var(--accent); }
  .badge.amber { background:var(--warn); border-color:var(--warnline); color:var(--warnink); }
  .badge.green { background:var(--ok); border-color:transparent; color:var(--okink); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 16px; } .meta .badge { white-space:normal; max-width:100%; }
  table { width:100%; border-collapse:collapse; font-size:.94rem; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--ink2); font-weight:600; font-size:.85rem; } tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .kpi { font-size:2.3rem; font-weight:750; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:.15em 0 .1em; }
  .kpi small { font-size:1rem; font-weight:500; color:var(--ink2); letter-spacing:0; }
  .posbar { position:relative; height:8px; border-radius:999px; background:var(--bar); margin:10px 0 4px; min-width:80px; }
  .posbar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); opacity:.22; }
  .posbar .mk { position:absolute; top:-4px; width:4px; height:16px; margin-left:-2px; border-radius:2px; background:var(--mark); }
  .posbar.thin { height:6px; margin:6px 0 0; } .posbar.thin .mk { top:-4px; height:14px; }
  .scale { display:flex; justify-content:space-between; font-size:.75rem; color:var(--ink3); }
  ul.plain { list-style:none; padding:0; margin:0; } ul.plain li { padding:6px 0; border-bottom:1px solid var(--line); }
  ul.plain li:last-child { border-bottom:0; }
  details > summary { cursor:pointer; font-weight:650; list-style:none; } details > summary::-webkit-details-marker { display:none; }
  details > summary::before { content:"+"; display:inline-block; width:1.2em; color:var(--accent); font-weight:800; }
  details[open] > summary::before { content:"\2212"; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; background:var(--accent);
         color:var(--accent-ink); border:0; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(1.06); } .btn:focus-visible, a:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); padding:7px 12px; font-weight:600; font-size:.9rem; }
  footer.foot { border-top:1px solid var(--line); color:var(--ink3); font-size:.85rem; padding:16px 0 28px; }
  @media (max-width:560px) { h1 { font-size:1.45rem; } .kpi { font-size:1.9rem; } .card { padding:16px; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ url_for('index') }}"><span class="dot" aria-hidden="true">0</span>{{ T.title }}</a>
  <nav>{% set here = request.endpoint %}
    <a href="{{ url_for('index') }}" class="{{ 'on' if here in ('index', 'submit') }}">New video</a>
    <a href="{{ url_for('about') }}" class="{{ 'on' if here == 'about' }}">About this tool</a></nav>
</div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
<footer class="foot"><div class="wrap">{{ T.footer }}</div></footer>
{% block script %}{% endblock %}
</body>
</html>
